<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="BankCards — commandez votre carte bancaire premium en quelques gestes. Démo Flutter : vol Hero 3D, swipe incliné, paillettes dorées, paiement animé et reçu imprimé.">
  <meta name="theme-color" content="#0A1F44">
  <meta property="og:title" content="BankCards · Flutter">
  <meta property="og:description" content="Commande de carte premium animée en Flutter (bleu, blanc, noir & or).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BankCards">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BankCards · Commandez votre carte premium</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Hauteur dynamique : Flutter suit la barre d'outils de Safari qui apparaît/disparaît. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #07090F;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    // Flutter remplace la balise viewport au démarrage : on y remet viewport-fit=cover.
    (function () {
      function ensure() {
        var m = document.querySelector('meta[name="viewport"]');
        if (!m) {
          m = document.createElement('meta');
          m.name = 'viewport';
          document.head.appendChild(m);
        }
        if ((m.getAttribute('content') || '').indexOf('viewport-fit=cover') === -1) {
          m.setAttribute('content', (m.getAttribute('content') || 'width=device-width, initial-scale=1.0') + ', viewport-fit=cover');
        }
      }
      ensure();
      new MutationObserver(ensure).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
